name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Capacitor Dependencies
        run: npm install

      - name: Add Android & Sync
        run: |
          npx cap add android
          npx cap sync android

      - name: Inject AdMob App ID to AndroidManifest
        run: |
          node -e "
          const fs = require('fs');
          const p = 'android/app/src/main/AndroidManifest.xml';
          if (fs.existsSync(p)) {
            let c = fs.readFileSync(p, 'utf8');
            const meta = '<meta-data android:name=\"com.google.android.gms.ads.APPLICATION_ID\" android:value=\"ca-app-pub-3940256099942544~3347511713\"/>';
            if (!c.includes('com.google.android.gms.ads.APPLICATION_ID')) {
              c = c.replace('</application>', meta + '\n</application>');
              fs.writeFileSync(p, c);
            }
          }
          "

      - name: Build APK via Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: game-jebakan-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          

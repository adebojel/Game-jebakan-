<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Game Teka-Teki Jebakan</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; touch-action: none; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f3f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        #game-container {
            width: 100%;
            max-width: 400px;
            height: 650px;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }
        .header {
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #f0f0f0;
        }
        .level-title { font-size: 18px; font-weight: bold; color: #333; }
        .btn-hint {
            background-color: #ff9f43;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .question-box {
            padding: 20px;
            text-align: center;
            font-size: 20px;
            font-weight: 600;
            color: #2c3e50;
            min-height: 80px;
        }
        .interactable-text {
            color: #ee5253;
            cursor: grab;
            display: inline-block;
            position: relative;
            z-index: 10;
            font-weight: bold;
        }
        .play-area {
            flex: 1;
            position: relative;
            background-color: #fdfdfd;
            margin: 10px;
            border: 2px dashed #e0e0e0;
            border-radius: 15px;
            overflow: hidden;
        }
        .draggable {
            position: absolute;
            cursor: grab;
            touch-action: none;
            z-index: 10;
        }
        #ad-modal {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.9);
            color: white;
            z-index: 100;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }
        .ad-timer { font-size: 48px; color: #ff9f43; margin: 20px 0; font-weight: bold; }
        .hint-result { display: none; background: #2ed573; padding: 15px; border-radius: 10px; margin-top: 15px; }
        #victory-modal {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(46, 213, 115, 0.95);
            color: white;
            z-index: 90;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .btn-next {
            background: white; color: #2ed573; border: none;
            padding: 12px 30px; border-radius: 20px; font-weight: bold;
            font-size: 18px; margin-top: 20px; cursor: pointer;
        }
    </style>
</head>
<body>

<div id="game-container">
    <div class="header">
        <div class="level-title" id="level-num">Level 1</div>
        <button class="btn-hint" onclick="showAd()">💡 Petunjuk (Iklan 10s)</button>
    </div>

    <div class="question-box" id="question">Loading...</div>

    <div class="play-area" id="play-area"></div>

    <div id="ad-modal">
        <h3>Sponsor: Iklan Pendek</h3>
        <p>Petunjuk akan terbuka setelah iklan selesai</p>
        <div class="ad-timer" id="ad-timer">10</div>
        <div class="hint-result" id="hint-text"></div>
        <button id="close-ad-btn" style="display:none; margin-top:15px; padding:10px 20px;" onclick="closeAd()">Tutup</button>
    </div>

    <div id="victory-modal">
        <h1>BERHASIL! 🎉</h1>
        <p>Logika kamu luar biasa!</p>
        <button class="btn-next" onclick="nextLevel()">Level Berikutnya ➡️</button>
    </div>
</div>

<script>
    let currentLevel = 0;
    let hintTextData = "";

    function isOverlapping(rect1, rect2) {
        return !(rect1.right < rect2.left || 
                 rect1.left > rect2.right || 
                 rect1.bottom < rect2.top || 
                 rect1.top > rect2.bottom);
    }

    const levels = [
        {
            num: 1,
            question: 'Buat <span id="drag-api" class="interactable-text">api</span> unggun ini menyala!',
            hint: 'Geser kata "api" yang ada pada teks judul di atas langsung ke kayu.',
            setup: function(container) {
                container.innerHTML = `<div id="kayu" style="position:absolute; bottom:30px; left:130px; font-size:60px;">🪵</div>`;
                let apiEl = document.getElementById('drag-api');
                makeDraggable(apiEl, () => {
                    let kayuRect = document.getElementById('kayu').getBoundingClientRect();
                    let apiRect = apiEl.getBoundingClientRect();
                    if (isOverlapping(apiRect, kayuRect)) {
                        document.getElementById('kayu').innerHTML = "🔥";
                        setTimeout(winLevel, 500);
                    }
                });
            }
        },
        {
            num: 2,
            question: 'Bantu Gajah melompati pagar!',
            hint: 'Gajah tidak bisa melompat. Tarik pagar tersebut ke bawah hingga hilang dari layar.',
            setup: function(container) {
                container.innerHTML = `
                    <div id="gajah" onclick="gajahGagal()" style="position:absolute; bottom:20px; left:20px; font-size:60px; cursor:pointer;">🐘</div>
                    <div id="pagar" class="draggable" style="position:absolute; bottom:0px; left:160px; font-size:50px;">🪵🧱</div>
                `;
                let pagar = document.getElementById('pagar');
                makeDraggable(pagar, () => {
                    let topVal = parseInt(pagar.style.top) || 0;
                    if (topVal > 150) {
                        pagar.style.display = 'none';
                    }
                });
            }
        },
        {
            num: 3,
            question: 'Buka pintu rahasia ini!',
            hint: 'Ketuk kunci kecil beberapa kali hingga ukurannya membesar, lalu geser ke pintu.',
            setup: function(container) {
                container.innerHTML = `
                    <div id="pintu" style="position:absolute; top:80px; left:140px; font-size:80px;">🚪</div>
                    <div id="kunci" class="draggable" style="position:absolute; top:200px; left:40px; font-size:25px; transition: transform 0.2s;">🔑</div>
                `;
                let size = 25;
                let kunci = document.getElementById('kunci');
                kunci.addEventListener('click', () => {
                    size += 15;
                    kunci.style.fontSize = size + 'px';
                });
                makeDraggable(kunci, () => {
                    let pintuRect = document.getElementById('pintu').getBoundingClientRect();
                    let kunciRect = kunci.getBoundingClientRect();
                    if (isOverlapping(kunciRect, pintuRect) && size >= 55) {
                        document.getElementById('pintu').innerHTML = "🚪✨";
                        setTimeout(winLevel, 500);
                    }
                });
            }
        },
        {
            num: 4,
            question: 'Cari tombol <span id="drag-lanjut" class="interactable-text">LANJUT</span> untuk menyelesaikan game!',
            hint: 'Tarik kata "LANJUT" di dalam soal ke dalam kotak permainan.',
            setup: function(container) {
                container.innerHTML = `
                    <button style="position:absolute; top:80px; left:40px; padding:10px 20px;">ULANG</button>
                    <button style="position:absolute; top:80px; left:200px; padding:10px 20px;">KELUAR</button>
                    <div id="drop-zone" style="position:absolute; bottom:50px; left:40px; right:40px; height:100px; border:2px dashed #ccc; display:flex; justify-content:center; align-items:center; color:#aaa;">Taruh tombol di sini</div>
                `;
                let lanjutEl = document.getElementById('drag-lanjut');
                makeDraggable(lanjutEl, () => {
                    let zoneRect = document.getElementById('drop-zone').getBoundingClientRect();
                    let lanjutRect = lanjutEl.getBoundingClientRect();
                    if (isOverlapping(lanjutRect, zoneRect)) {
                        winLevel();
                    }
                });
            }
        },
        {
            num: 5,
            question: 'Mana benda yang TIDAK BISA dimakan?',
            hint: 'Geser semua makanan keluar dari piring, lalu ketuk piring yang kosong.',
            setup: function(container) {
                container.innerHTML = `
                    <div id="piring" onclick="clickPiring()" style="position:absolute; top:120px; left:120px; font-size:100px; cursor:pointer;">🍽️</div>
                    <div id="f1" class="draggable" style="position:absolute; top:150px; left:140px; font-size:40px;">🍕</div>
                    <div id="f2" class="draggable" style="position:absolute; top:150px; left:190px; font-size:40px;">🍗</div>
                `;
                makeDraggable(document.getElementById('f1'));
                makeDraggable(document.getElementById('f2'));
            }
        }
    ];

    function loadLevel() {
        let lvl = levels[currentLevel];
        document.getElementById('level-num').innerText = "Level " + lvl.num;
        document.getElementById('question').innerHTML = lvl.question;
        hintTextData = lvl.hint;
        let playArea = document.getElementById('play-area');
        playArea.innerHTML = "";
        document.getElementById('victory-modal').style.display = 'none';
        lvl.setup(playArea);
    }

    function winLevel() {
        document.getElementById('victory-modal').style.display = 'flex';
    }

    function nextLevel() {
        currentLevel++;
        if (currentLevel < levels.length) {
            loadLevel();
        } else {
            alert("Selamat! Kamu telah menyelesaikan semua level prototipe!");
            currentLevel = 0;
            loadLevel();
        }
    }

    function gajahGagal() {
        if(document.getElementById('pagar').style.display !== 'none') {
            alert("Gajah menabrak pagar! Hilangkan pagarnya dulu.");
        } else {
            winLevel();
        }
    }

    function clickPiring() {
        let f1 = document.getElementById('f1').getBoundingClientRect();
        let f2 = document.getElementById('f2').getBoundingClientRect();
        let piring = document.getElementById('piring').getBoundingClientRect();

        let f1OnPiring = isOverlapping(f1, piring);
        let f2OnPiring = isOverlapping(f2, piring);

        if(!f1OnPiring && !f2OnPiring) {
            winLevel();
        } else {
            alert("Pindahkan dulu makanan dari atas piring!");
        }
    }

    function makeDraggable(elmnt, onDropCallback) {
        let startX = 0, startY = 0, initialLeft = 0, initialTop = 0;

        elmnt.addEventListener('touchstart', dragStart, { passive: false });
        elmnt.addEventListener('mousedown', dragStart);

        function dragStart(e) {
            e.preventDefault();
            let touch = e.touches ? e.touches[0] : e;
            startX = touch.clientX;
            startY = touch.clientY;
            
            initialLeft = parseInt(elmnt.style.left) || 0;
            initialTop = parseInt(elmnt.style.top) || 0;

            document.addEventListener('touchmove', dragMove, { passive: false });
            document.addEventListener('mousemove', dragMove);
            document.addEventListener('touchend', dragEnd);
            document.addEventListener('mouseup', dragEnd);
        }

        function dragMove(e) {
            e.preventDefault();
            let touch = e.touches ? e.touches[0] : e;
            let dx = touch.clientX - startX;
            let dy = touch.clientY - startY;

            elmnt.style.left = (initialLeft + dx) + 'px';
            elmnt.style.top = (initialTop + dy) + 'px';
        }

        function dragEnd(e) {
            document.removeEventListener('touchmove', dragMove);
            document.removeEventListener('mousemove', dragMove);
            document.removeEventListener('touchend', dragEnd);
            document.removeEventListener('mouseup', dragEnd);

            if (onDropCallback) {
                onDropCallback();
            }
        }
    }

    function showAd() {
        let modal = document.getElementById('ad-modal');
        let timerDisplay = document.getElementById('ad-timer');
        let hintDisplay = document.getElementById('hint-text');
        let closeBtn = document.getElementById('close-ad-btn');
        
        modal.style.display = 'flex';
        hintDisplay.style.display = 'none';
        closeBtn.style.display = 'none';
        let timeLeft = 10;
        timerDisplay.innerText = timeLeft;

        let countdown = setInterval(() => {
            timeLeft--;
            timerDisplay.innerText = timeLeft;
            if (timeLeft <= 0) {
                clearInterval(countdown);
                timerDisplay.innerText = "Selesai!";
                hintDisplay.innerText = hintTextData;
                hintDisplay.style.display = 'block';
                closeBtn.style.display = 'block';
            }
        }, 1000);
    }

    function closeAd() {
        document.getElementById('ad-modal').style.display = 'none';
    }

    loadLevel();
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="id" class="notranslate" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="google" content="notranslate">
    <title>Game Jebakan Brain Out</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #e3f2fd;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
        }

        /* Container Main Card */
        .game-card {
            background-color: #ff6b6b;
            width: 100%;
            max-width: 420px;
            height: 90vh;
            max-height: 750px;
            border-radius: 28px;
            padding: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
        }

        /* Top Bar Header */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .coin-badge {
            background-color: #ff8e8e;
            padding: 6px 14px;
            border-radius: 20px;
            color: #ffffff;
            font-weight: bold;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .level-info {
            text-align: center;
            color: #ffffff;
        }

        .level-title {
            font-size: 18px;
            font-weight: 800;
            letter-spacing: 0.5px;
        }

        .level-tag {
            font-size: 10px;
            background-color: #ffeaa7;
            color: #d63031;
            padding: 2px 8px;
            border-radius: 10px;
            font-weight: bold;
            display: inline-block;
            margin-top: 2px;
        }

        .action-buttons {
            display: flex;
            gap: 6px;
        }

        .icon-btn {
            background-color: #48dbfb;
            border: none;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        /* Puzzle Canvas Area */
        .puzzle-card {
            background-color: #fafafa;
            flex: 1;
            border-radius: 20px;
            padding: 20px 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            margin: 10px 0;
            overflow: hidden;
        }

        .puzzle-title {
            color: #2d3436;
            font-size: 18px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 15px;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .puzzle-canvas {
            width: 100%;
            flex: 1;
            border: 2px dashed #ccc;
            border-radius: 16px;
            position: relative;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-around;
            align-items: center;
            padding: 10px;
        }

        /* Elements inside Puzzle Area */
        .game-object {
            font-size: 55px;
            cursor: pointer;
            transition: transform 0.2s ease;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .game-object:active {
            transform: scale(1.2);
        }

        /* Bottom Control Bar */
        .bottom-bar {
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }

        .btn-bottom {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 20px;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .btn-hint {
            background-color: #00cec9;
            color: #ffffff;
        }

        .btn-skip {
            background-color: #ffeaa7;
            color: #d63031;
        }

        /* Alert Overlay */
        .overlay-msg {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.85);
            color: #fff;
            padding: 15px 25px;
            border-radius: 12px;
            font-weight: bold;
            display: none;
            z-index: 100;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="game-card">
        <!-- Top Bar -->
        <div class="top-bar">
            <div class="coin-badge">
                <span>🟡</span> <span id="coin-count">60</span>
            </div>
            <div class="level-info">
                <div class="level-title" id="level-title-text">LEVEL 1</div>
                <div class="level-tag">BRAIN OUT</div>
            </div>
            <div class="action-buttons">
                <button class="icon-btn" onclick="restartLevel()">🔄</button>
                <button class="icon-btn" onclick="toggleSensorInfo()">📱</button>
            </div>
        </div>

        <!-- Area Puzzle -->
        <div class="puzzle-card">
            <div class="puzzle-title" id="puzzle-instruction">Memuat teka-teki...</div>
            <div class="puzzle-canvas" id="puzzle-canvas"></div>
            <div class="overlay-msg" id="overlay-msg"></div>
        </div>

        <!-- Bottom Buttons -->
        <div class="bottom-bar">
            <button class="btn-bottom btn-hint" onclick="useHint()">💡 Petunjuk (20 🪙)</button>
            <button class="btn-bottom btn-skip" onclick="skipLevel()">⏭️ Lewati (30 🪙)</button>
        </div>
    </div>

    <script>
        // --- 1. DETEKTOR ERROR UNTUK HP ANDROID ---
        window.onerror = function(msg, url, lineNo) {
            alert("🔴 Error Kodingan:\n" + msg + "\nBaris: " + lineNo);
            return false;
        };

        // --- 2. STATE GAME & LOCALSTORAGE ---
        let gameState = {
            currentLevel: parseInt(localStorage.getItem('game_level')) || 1,
            coins: parseInt(localStorage.getItem('game_coins')) || 60
        };

        // --- 3. WEB AUDIO API (SOUND ENGINE OFFLINE) ---
        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playSound(type) {
            try {
                initAudio();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                if (type === 'correct') {
                    osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); // C5
                    osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1); // E5
                    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.3);
                } else if (type === 'wrong') {
                    osc.frequency.setValueAtTime(200, audioCtx.currentTime);
                    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.2);
                } else if (type === 'click') {
                    osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.05);
                }
            } catch (e) {
                console.log("Audio diblokir atau belum aktif.");
            }
        }

        // --- 4. GENERATOR DATA 500 LEVEL ---
        function getLevelData(levelNum) {
            // Contoh implementasi dinamis untuk 500 level
            // Menggunakan pola generator agar tidak memberatkan memori HP
            
            if (levelNum === 1) {
                return {
                    title: "Buah manakah yang paling besar secara nyata?",
                    hint: "Pikirkan ukuran buah aslinya di dunia nyata, bukan ukuran emoji!",
                    type: "choice",
                    items: [
                        { id: 1, text: "🍇", size: "60px", correct: false },
                        { id: 2, text: "🍓", size: "70px", correct: false },
                        { id: 3, text: "🍎", size: "50px", correct: false },
                        { id: 4, text: "🍉", size: "45px", correct: true } // Semangka paling besar di dunia nyata
                    ]
                };
            } else if (levelNum === 2) {
                return {
                    title: "Berapakah jumlah bulu mata di layar?",
                    hint: "Hitung semua garis hitam dengan teliti!",
                    type: "choice",
                    items: [
                        { id: 1, text: "👀 5", size: "50px", correct: false },
                        { id: 2, text: "👀 8", size: "50px", correct: true },
                        { id: 3, text: "👀 10", size: "50px", correct: false }
                    ]
                };
            } else if (levelNum === 3) {
                return {
                    title: "Temukan warna paling gelap!",
                    hint: "Teks judul juga memiliki warna!",
                    type: "choice",
                    items: [
                        { id: 1, text: "🔴", size: "55px", correct: false },
                        { id: 2, text: "🟡", size: "55px", correct: false },
                        { id: 3, text: "⬛", size: "55px", correct: true }
                    ]
                };
            } else {
                // Generator Otomatis untuk Level 4 hingga 500
                const targetNumber = (levelNum % 5) + 1;
                return {
                    title: `Teka-teki Level ${levelNum}: Ketuk angka ke-${targetNumber}!`,
                    hint: `Pilih item dengan urutan nomor ${targetNumber}`,
                    type: "choice",
                    items: [
                        { id: 1, text: "1️⃣", size: "50px", correct: targetNumber === 1 },
                        { id: 2, text: "2️⃣", size: "50px", correct: targetNumber === 2 },
                        { id: 3, text: "3️⃣", size: "50px", correct: targetNumber === 3 },
                        { id: 4, text: "4️⃣", size: "50px", correct: targetNumber === 4 }
                    ]
                };
            }
        }

        // --- 5. LOGIKA UTAMA RENDER GAME ---
        function loadLevel(levelNum) {
            const data = getLevelData(levelNum);
            
            // Update Header UI
            document.getElementById('level-title-text').innerText = "LEVEL " + levelNum;
            document.getElementById('coin-count').innerText = gameState.coins;
            document.getElementById('puzzle-instruction').innerText = data.title;
            
            const canvas = document.getElementById('puzzle-canvas');
            canvas.innerHTML = ''; // Bersihkan area kerja puzzle

            // Render Item/Objek Game
            if (data.type === 'choice') {
                data.items.forEach(item => {
                    const el = document.createElement('div');
                    el.className = 'game-object';
                    el.innerText = item.text;
                    el.style.fontSize = item.size || '50px';
                    
                    el.onclick = function() {
                        checkAnswer(item.correct);
                    };
                    
                    canvas.appendChild(el);
                });
            }
        }

        function checkAnswer(isCorrect) {
            playSound('click');
            if (isCorrect) {
                playSound('correct');
                showNotice("✅ BENAR!");
                setTimeout(() => {
                    gameState.currentLevel++;
                    gameState.coins += 5; // Bonus koin
                    saveProgress();
                    loadLevel(gameState.currentLevel);
                }, 1000);
            } else {
                playSound('wrong');
                showNotice("❌ SALAH! Coba lagi.");
            }
        }

        function showNotice(msg) {
            const overlay = document.getElementById('overlay-msg');
            overlay.innerText = msg;
            overlay.style.display = 'block';
            setTimeout(() => {
                overlay.style.display = 'none';
            }, 1200);
        }

        // --- 6. FITUR PETUNJUK & LEWATI ---
        function useHint() {
            playSound('click');
            if (gameState.coins >= 20) {
                gameState.coins -= 20;
                saveProgress();
                document.getElementById('coin-count').innerText = gameState.coins;
                const data = getLevelData(gameState.currentLevel);
                alert("💡 Petunjuk: " + data.hint);
            } else {
                alert("Koin tidak cukup!");
            }
        }

        function skipLevel() {
            playSound('click');
            if (gameState.coins >= 30) {
                gameState.coins -= 30;
                gameState.currentLevel++;
                saveProgress();
                loadLevel(gameState.currentLevel);
            } else {
                alert("Koin tidak cukup!");
            }
        }

        function restartLevel() {
            playSound('click');
            loadLevel(gameState.currentLevel);
        }

        function toggleSensorInfo() {
            playSound('click');
            alert("Fitur Sensor Aktif! Dibuat khusus untuk HP Moto G67.");
        }

        function saveProgress() {
            localStorage.setItem('game_level', gameState.currentLevel);
            localStorage.setItem('game_coins', gameState.coins);
        }

        // --- 7. STARTUP INITIALIZATION ---
        document.addEventListener('DOMContentLoaded', () => {
            loadLevel(gameState.currentLevel);
        });
    </script>
</body>
</html>

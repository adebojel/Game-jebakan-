<!DOCTYPE html>
<html lang="id" class="notranslate" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="google" content="notranslate">
    <title>Game Asah Otak - Full Features</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311b92 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 12px;
            overflow: hidden;
            position: relative;
        }

        /* Ambient Background Effect */
        .bg-blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(60px);
            opacity: 0.45;
            z-index: 0;
            animation: floatAnim 8s infinite alternate ease-in-out;
        }
        .blob-1 { width: 260px; height: 260px; background: #ff007f; top: -40px; left: -40px; }
        .blob-2 { width: 300px; height: 300px; background: #4f46e5; bottom: -50px; right: -50px; animation-delay: -4s; }

        @keyframes floatAnim {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(30px, 30px) scale(1.15); }
        }

        /* Container Utama */
        .app-container {
            position: relative;
            z-index: 10;
            background: rgba(255, 255, 255, 0.94);
            backdrop-filter: blur(16px);
            width: 100%;
            max-width: 420px;
            height: 92vh;
            max-height: 760px;
            border-radius: 36px;
            padding: 18px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6), inset 0 2px 4px rgba(255, 255, 255, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border: 3px solid rgba(255, 255, 255, 0.6);
            overflow: hidden;
        }

        .screen {
            display: none;
            flex-direction: column;
            height: 100%;
            justify-content: space-between;
        }
        .screen.active {
            display: flex;
        }

        /* --- HOME SCREEN --- */
        .home-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .coin-badge {
            background: linear-gradient(180deg, #fbbf24, #d97706);
            padding: 8px 16px;
            border-radius: 50px;
            color: #ffffff;
            font-weight: 900;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
            text-shadow: 0 1px 2px rgba(0,0,0,0.3);
            box-shadow: 0 3px 0 #b45309, 0 4px 8px rgba(0,0,0,0.15);
        }

        .home-hero {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            margin: auto 0;
        }

        .home-logo {
            font-size: 72px;
            margin-bottom: 10px;
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.15));
            animation: bounceLogo 2s infinite ease-in-out;
        }

        @keyframes bounceLogo {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .home-title {
            font-size: 28px;
            font-weight: 900;
            color: #0f172a;
            letter-spacing: 0.5px;
        }

        .home-subtitle {
            font-size: 13px;
            color: #64748b;
            font-weight: 700;
            margin-top: 4px;
        }

        .home-menu {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
        }

        .btn-main {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 20px;
            font-size: 16px;
            font-weight: 900;
            color: white;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            transition: transform 0.1s;
            text-shadow: 0 1px 2px rgba(0,0,0,0.2);
        }

        .btn-play {
            background: linear-gradient(180deg, #10b981, #059669);
            box-shadow: 0 5px 0 #047857, 0 8px 15px rgba(16, 185, 129, 0.3);
        }
        .btn-play:active { transform: translateY(3px); box-shadow: 0 2px 0 #047857; }

        .btn-levels {
            background: linear-gradient(180deg, #6366f1, #4f46e5);
            box-shadow: 0 5px 0 #3730a3, 0 8px 15px rgba(99, 102, 241, 0.3);
        }
        .btn-levels:active { transform: translateY(3px); box-shadow: 0 2px 0 #3730a3; }

        .btn-settings {
            background: linear-gradient(180deg, #06b6d4, #0891b2);
            box-shadow: 0 5px 0 #0e7490, 0 8px 15px rgba(6, 182, 212, 0.3);
        }
        .btn-settings:active { transform: translateY(3px); box-shadow: 0 2px 0 #0e7490; }

        /* --- GAME SCREEN --- */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(180deg, #f8fafc 0%, #e2e8f0 100%);
            padding: 8px 12px;
            border-radius: 22px;
            box-shadow: inset 0 2px 4px rgba(255,255,255,0.8), 0 4px 10px rgba(0,0,0,0.08);
        }

        .icon-btn {
            background: linear-gradient(180deg, #06b6d4, #0891b2);
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 16px;
            cursor: pointer;
            color: white;
            box-shadow: 0 3px 0 #0e7490, 0 4px 8px rgba(0,0,0,0.2);
            transition: transform 0.1s;
        }
        .icon-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #0e7490; }

        .level-info { text-align: center; }
        .level-title { font-size: 16px; font-weight: 900; color: #1e293b; }
        .level-tag {
            font-size: 9px;
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: #ffffff;
            padding: 2px 8px;
            border-radius: 12px;
            font-weight: 800;
            display: inline-block;
            margin-top: 2px;
            text-transform: uppercase;
        }

        .progress-bar-container {
            width: 100%;
            height: 6px;
            background: #e2e8f0;
            border-radius: 10px;
            margin: 10px 0 2px 0;
            overflow: hidden;
        }
        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #6366f1, #a855f7);
            transition: width 0.4s ease;
        }

        .puzzle-card {
            background: linear-gradient(180deg, #ffffff 0%, #f1f5f9 100%);
            flex: 1;
            border-radius: 28px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            margin: 10px 0;
            border: 2px solid #e2e8f0;
            overflow: hidden;
        }

        .puzzle-title {
            color: #0f172a;
            font-size: 15px;
            font-weight: 800;
            text-align: center;
            margin-bottom: 10px;
            min-height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1.3;
        }

        .puzzle-canvas {
            width: 100%;
            flex: 1;
            background: #f8fafc;
            border-radius: 22px;
            position: relative;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-around;
            align-items: center;
            padding: 12px;
            box-shadow: inset 0 2px 8px rgba(0,0,0,0.05);
            border: 1px solid #cbd5e1;
            gap: 10px;
        }

        .game-object {
            font-size: 45px;
            cursor: pointer;
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
            border-radius: 20px;
            background: #ffffff;
            box-shadow: 0 8px 16px rgba(0,0,0,0.08);
            border: 2px solid #f1f5f9;
        }
        .game-object:active { transform: scale(1.15) !important; }

        .sensor-badge {
            position: absolute;
            bottom: 8px;
            background: rgba(16, 185, 129, 0.15);
            color: #059669;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 800;
        }

        .bottom-bar { display: flex; gap: 10px; }
        .btn-bottom {
            flex: 1;
            padding: 12px 8px;
            border: none;
            border-radius: 18px;
            font-weight: 800;
            font-size: 12px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 4px;
            color: #ffffff;
            transition: transform 0.1s;
        }
        .btn-hint { background: linear-gradient(180deg, #10b981, #059669); box-shadow: 0 4px 0 #047857; }
        .btn-hint:active { transform: translateY(3px); box-shadow: 0 1px 0 #047857; }
        .btn-skip { background: linear-gradient(180deg, #f97316, #ea580c); box-shadow: 0 4px 0 #c2410c; }
        .btn-skip:active { transform: translateY(3px); box-shadow: 0 1px 0 #c2410c; }

        .overlay-msg {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(15, 23, 42, 0.95);
            color: #ffffff;
            padding: 16px 24px;
            border-radius: 24px;
            font-weight: 800;
            font-size: 15px;
            display: none;
            z-index: 100;
            text-align: center;
            box-shadow: 0 20px 30px rgba(0,0,0,0.4);
            border: 2px solid rgba(255,255,255,0.2);
        }

        /* --- MODALS --- */
        .modal-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(8px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 200;
            border-radius: 36px;
            padding: 16px;
        }

        .modal-content {
            background: #ffffff;
            width: 100%;
            max-height: 88%;
            border-radius: 28px;
            padding: 18px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            padding-bottom: 8px;
            border-bottom: 2px solid #e2e8f0;
        }

        .modal-header h3 { font-size: 16px; color: #0f172a; font-weight: 800; }
        .close-btn {
            background: #ef4444; color: white; border: none;
            width: 32px; height: 32px; border-radius: 50%;
            font-weight: bold; cursor: pointer;
        }

        .level-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            overflow-y: auto;
            padding: 6px;
        }

        .level-item {
            height: 48px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 14px;
            font-weight: 800;
            font-size: 14px;
            cursor: pointer;
            border: none;
        }
        .level-item.unlocked { background: linear-gradient(180deg, #10b981, #059669); color: white; box-shadow: 0 3px 0 #047857; }
        .level-item.current { background: linear-gradient(180deg, #f59e0b, #d97706); color: white; box-shadow: 0 3px 0 #b45309; border: 2px solid #0f172a; }
        .level-item.locked { background: #e2e8f0; color: #64748b; box-shadow: 0 3px 0 #cbd5e1; }

        .setting-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 0;
            border-bottom: 1px solid #f1f5f9;
        }
        .setting-label {
            font-size: 15px;
            font-weight: 800;
            color: #1e293b;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .toggle-btn {
            background: #cbd5e1;
            border: none;
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: 800;
            font-size: 12px;
            color: white;
            cursor: pointer;
        }
        .toggle-btn.active { background: #10b981; }

        .unlock-card {
            background: white;
            border-radius: 24px;
            padding: 20px;
            text-align: center;
            width: 100%;
            max-width: 320px;
        }
        .unlock-card h4 { font-size: 18px; color: #0f172a; margin-bottom: 8px; font-weight: 900; }
        .unlock-card p { font-size: 13px; color: #64748b; margin-bottom: 16px; }
        .unlock-actions { display: flex; flex-direction: column; gap: 8px; }
    </style>
</head>
<body>

    <div class="bg-blob blob-1"></div>
    <div class="bg-blob blob-2"></div>

    <div class="app-container">
        
        <!-- 1. HOME SCREEN -->
        <div class="screen active" id="home-screen">
            <div class="home-header">
                <div class="coin-badge">
                    <span>🟡</span> <span class="coin-count-text">60</span>
                </div>
                <button class="icon-btn" onclick="watchRewardedAd()" title="Koin Gratis">🎥 +20</button>
            </div>

            <div class="home-hero">
                <div class="home-logo">🧠</div>
                <div class="home-title">ASAH OTAK</div>
                <div class="home-subtitle">Uji Kecerdasan & Logika Kamu!</div>
            </div>

            <div class="home-menu">
                <button class="btn-main btn-play" onclick="startCurrentLevel()">
                    <span>▶️</span> MULAI BERMAIN
                </button>
                <button class="btn-main btn-levels" onclick="openLevelModal()">
                    <span>🗺️</span> PILIH LEVEL
                </button>
                <button class="btn-main btn-settings" onclick="openSettingsModal()">
                    <span>⚙️</span> PENGATURAN
                </button>
            </div>
        </div>

        <!-- 2. GAME SCREEN -->
        <div class="screen" id="game-screen">
            <div class="top-bar">
                <button class="icon-btn" title="Beranda" onclick="showHomeScreen()">🏠</button>
                <div class="coin-badge">
                    <span>🟡</span> <span class="coin-count-text">60</span>
                </div>
                <div class="level-info">
                    <div class="level-title" id="level-title-text">LEVEL 1</div>
                    <div class="level-tag">ASAH OTAK</div>
                </div>
                <div class="action-buttons" style="display: flex; gap: 4px;">
                    <button class="icon-btn" title="Pilih Level" onclick="openLevelModal()">🗺️</button>
                    <button class="icon-btn" title="Ulangi" onclick="restartLevel()">🔄</button>
                </div>
            </div>

            <div class="progress-bar-container">
                <div class="progress-bar-fill" id="progress-fill"></div>
            </div>

            <div class="puzzle-card">
                <div class="puzzle-title" id="puzzle-instruction">Memuat teka-teki...</div>
                <div class="puzzle-canvas" id="puzzle-canvas"></div>
                <div class="sensor-badge" id="sensor-badge" style="display: none;">
                    📡 Sensor Gerak Aktif
                </div>
                <div class="overlay-msg" id="overlay-msg"></div>
            </div>

            <div class="bottom-bar">
                <button class="btn-bottom btn-hint" onclick="useHint()">💡 Petunjuk (20 🪙)</button>
                <button class="btn-bottom btn-skip" onclick="skipLevel()">⏭ Lewati (30 🪙)</button>
            </div>
        </div>

        <!-- 3. SETTINGS MODAL -->
        <div class="modal-overlay" id="settings-modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h3>⚙️ Pengaturan</h3>
                    <button class="close-btn" onclick="closeSettingsModal()">✖</button>
                </div>
                <div>
                    <div class="setting-row">
                        <div class="setting-label">🎵 Musik & Suara</div>
                        <button class="toggle-btn active" id="toggle-sound-btn" onclick="toggleSound()">AKTIF</button>
                    </div>
                    <div class="setting-row">
                        <div class="setting-label">📳 Efek Getaran</div>
                        <button class="toggle-btn active" id="toggle-vibrate-btn" onclick="toggleVibration()">AKTIF</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 4. LEVEL SELECT MODAL -->
        <div class="modal-overlay" id="level-modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h3>🗺️ Pilih Level (1 - 50)</h3>
                    <button class="close-btn" onclick="closeLevelModal()">✖</button>
                </div>
                <div class="level-grid" id="level-grid"></div>
            </div>
        </div>

        <!-- 5. UNLOCK LEVEL PROMPT -->
        <div class="modal-overlay" id="unlock-modal">
            <div class="unlock-card">
                <h4>🔒 Level Terkunci</h4>
                <p id="unlock-desc-text">Buka level ini untuk melanjutkan permainan!</p>
                <div class="unlock-actions">
                    <button class="btn-main btn-play" onclick="unlockLevelWithAd()">🎥 Buka Gratis (Tonton Iklan)</button>
                    <button class="btn-main btn-levels" onclick="unlockLevelWithCoins()">🪙 Buka (Bayar 30 Koin)</button>
                    <button class="btn-main" style="background:#64748b;" onclick="closeUnlockModal()">Batal</button>
                </div>
            </div>
        </div>

    </div>

    <script>
        const MAX_LEVELS = 50;
        
        let rawLevel = parseInt(localStorage.getItem('game_level')) || 1;
        let rawMaxUnlocked = parseInt(localStorage.getItem('game_max_level')) || rawLevel;

        let gameState = {
            currentLevel: rawLevel > MAX_LEVELS ? 1 : rawLevel,
            maxUnlockedLevel: rawMaxUnlocked > MAX_LEVELS ? 1 : rawMaxUnlocked,
            coins: parseInt(localStorage.getItem('game_coins')) || 60,
            soundEnabled: localStorage.getItem('game_sound') !== 'false',
            vibrateEnabled: localStorage.getItem('game_vibrate') !== 'false'
        };

        let isLevelCompleting = false;
    let activeSensorType = null;
        let lastSensorTriggerTime = 0;

        function saveProgress() {
            localStorage.setItem('game_level', gameState.currentLevel);
            localStorage.setItem('game_max_level', gameState.maxUnlockedLevel);
            localStorage.setItem('game_coins', gameState.coins);
            localStorage.setItem('game_sound', gameState.soundEnabled);
            localStorage.setItem('game_vibrate', gameState.vibrateEnabled);
            updateCoinDisplay();
        }

        function updateCoinDisplay() {
            document.querySelectorAll('.coin-count-text').forEach(el => {
                el.innerText = gameState.coins;
            });
        }

        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        function showHomeScreen() {
            disableSensors();
            showScreen('home-screen');
        }

        function startCurrentLevel() {
            showScreen('game-screen');
            loadLevel(gameState.currentLevel);
        }

        /* --- PERBAIKAN SISTEM GETARAN (HARDWARE HAPTICS & FALLBACK) --- */
        async function triggerVibrate(pattern = 100) {
            if (!gameState.vibrateEnabled) return;
            try {
                // Utamakan Capacitor Haptics jika di APK
                if (window.Capacitor?.Plugins?.Haptics) {
                    const duration = Array.isArray(pattern) ? pattern[0] : pattern;
                    await window.Capacitor.Plugins.Haptics.vibrate({ duration: duration || 100 });
                } 
                // Fallback ke navigator.vibrate standar web
                else if ("vibrate" in navigator) {
                    navigator.vibrate(pattern);
                }
            } catch (e) {
                console.log("Vibrate status:", e);
            }
        }

        /* --- SISTEM MUSIK BACKGROUND FOCUS, CALM, & MENANTANG --- */
        let audioCtx = null;
        let bgmInterval = null;
        let bgmStep = 0;

        // Tangga nada ambient pentatonik misterius & fokus
        const bgmNotes = [130.81, 155.56, 174.61, 196.00, 233.08, 261.63, 311.13, 392.00];
        const chordPad = [
            [130.81, 196.00, 311.13], // Cm
            [116.54, 174.61, 293.66], // Bb
            [103.83, 155.56, 261.63], // Ab
            [98.00,  146.83, 246.94]  // G
        ];

        function initAudio() {
            if (!audioCtx) {
                const AudioCtxClass = window.AudioContext || window.webkitAudioContext;
                if (AudioCtxClass) audioCtx = new AudioCtxClass();
            }
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playBgmStep() {
            if (!gameState.soundEnabled || !audioCtx) return;
            try {
                const now = audioCtx.currentTime;

                // 1. Warm Synth Pad Chords (Menciptakan Suasana Tenang & Fokus)
                if (bgmStep % 8 === 0) {
                    const chordIdx = Math.floor(bgmStep / 8) % chordPad.length;
                    chordPad[chordIdx].forEach(freq => {
                        const osc = audioCtx.createOscillator();
                        const gain = audioCtx.createGain();
                        const filter = audioCtx.createBiquadFilter();

                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(freq, now);

                        filter.type = 'lowpass';
                        filter.frequency.setValueAtTime(400, now);

                        gain.gain.setValueAtTime(0.001, now);
                        gain.gain.linearRampToValueAtTime(0.025, now + 0.5);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + 2.8);

                        osc.connect(filter);
                        filter.connect(gain);
                        gain.connect(audioCtx.destination);

                        osc.start(now);
                        osc.stop(now + 3.0);
                    });
                }

                // 2. Arpeggio Synth Note (Memberikan Kesan Menantang & Asah Otak)
                if (Math.random() > 0.25) {
                    const noteIdx = (bgmStep * 3 + Math.floor(Math.random() * 3)) % bgmNotes.length;
                    const freq = bgmNotes[noteIdx];

                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    const filter = audioCtx.createBiquadFilter();

                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, now);

                    filter.type = 'lowpass';
                    filter.frequency.setValueAtTime(750, now);

                    gain.gain.setValueAtTime(0.001, now);
                    gain.gain.linearRampToValueAtTime(0.02, now + 0.08);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.7);

                    osc.connect(filter);
                    filter.connect(gain);
                    gain.connect(audioCtx.destination);

                    osc.start(now);
                    osc.stop(now + 0.75);
                }

                bgmStep = (bgmStep + 1) % 32;
            } catch(e) {}
        }

        function playSound(type) {
            if (!gameState.soundEnabled) return;
            try {
                initAudio();
                if (!audioCtx) return;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                if (type === 'correct') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
                    osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1);
                    osc.frequency.setValueAtTime(783.99, audioCtx.currentTime + 0.2);
                    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.4);
                } else if (type === 'wrong') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(180, audioCtx.currentTime);
                    osc.frequency.setValueAtTime(140, audioCtx.currentTime + 0.1);
                    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.3);
                } else if (type === 'click') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(450, audioCtx.currentTime);
                    gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.05);
                }
            } catch (e) {}
        }

        function toggleSound() {
            gameState.soundEnabled = !gameState.soundEnabled;
            saveProgress();
            updateSettingsUI();
            if (gameState.soundEnabled) {
                initAudio();
                if (!bgmInterval) bgmInterval = setInterval(playBgmStep, 360);
            } else {
                if (bgmInterval) { clearInterval(bgmInterval); bgmInterval = null; }
            }
        }

        function toggleVibration() {
            gameState.vibrateEnabled = !gameState.vibrateEnabled;
            saveProgress();
            updateSettingsUI();
            if (gameState.vibrateEnabled) {
                triggerVibrate(150);
            }
        }

        function updateSettingsUI() {
            const soundBtn = document.getElementById('toggle-sound-btn');
            soundBtn.innerText = gameState.soundEnabled ? 'AKTIF' : 'MATI';
            soundBtn.className = 'toggle-btn ' + (gameState.soundEnabled ? 'active' : '');

            const vibBtn = document.getElementById('toggle-vibrate-btn');
            vibBtn.innerText = gameState.vibrateEnabled ? 'AKTIF' : 'MATI';
            vibBtn.className = 'toggle-btn ' + (gameState.vibrateEnabled ? 'active' : '');
        }

        /* --- SENSOR DENGAN PENGUNCI & AMBANG BATAS --- */
        function enableSensors(sensorType) {
            disableSensors();
            activeSensorType = sensorType;
            document.getElementById('sensor-badge').style.display = 'flex';

            if (sensorType === 'shake') {
                window.addEventListener('devicemotion', handleMotion, false);
            } else if (sensorType === 'tilt') {
                window.addEventListener('deviceorientation', handleOrientation, false);
            }
        }

        function disableSensors() {
            window.removeEventListener('devicemotion', handleMotion, false);
            window.removeEventListener('deviceorientation', handleOrientation, false);
            activeSensorType = null;
            document.getElementById('sensor-badge').style.display = 'none';
        }

        function handleMotion(e) {
            if (isLevelCompleting) return;
            const acc = e.accelerationIncludingGravity;
            if (!acc) return;
            const totalForce = Math.abs(acc.x) + Math.abs(acc.y) + Math.abs(acc.z);
            
            if (totalForce > 40) {
                const now = Date.now();
                if (now - lastSensorTriggerTime > 1500) {
                    lastSensorTriggerTime = now;
                    onSensorTriggered('shake');
                }
            }
        }

        function handleOrientation(e) {
            if (isLevelCompleting) return;
            const gamma = e.gamma;
            if (Math.abs(gamma) > 55) {
                const now = Date.now();
                if (now - lastSensorTriggerTime > 1500) {
                    lastSensorTriggerTime = now;
                    onSensorTriggered('tilt');
                }
            }
        }
        function onSensorTriggered(action) {
            if (activeSensorType === action && !isLevelCompleting) {
                triggerVibrate(150);
                checkAnswer(true);
            }
        }

        /* --- ADMOB INTEGRATION --- */
        const ADMOB_TEST_BANNER = 'ca-app-pub-9305273212801233/9094905669';
        const ADMOB_TEST_INTERSTITIAL = 'ca-app-pub-9305273212801233/1355093008';
        const ADMOB_TEST_REWARDED = 'ca-app-pub-9305273212801233/8495216428';

        async function initAdMob() {
            if (!window.Capacitor?.Plugins?.AdMob) return;
            const { AdMob } = window.Capacitor.Plugins;
            try {
                await AdMob.initialize({ requestTrackingAuthorization: true });
                showBannerAd();
            } catch (err) {}
        }

        async function showBannerAd() {
            if (!window.Capacitor?.Plugins?.AdMob) return;
            const { AdMob } = window.Capacitor.Plugins;
            try {
                await AdMob.showBanner({
                    adId: ADMOB_TEST_BANNER,
                    adSize: 'BANNER',
                    position: 'BOTTOM_CENTER',
                    margin: 0
                });
            } catch (e) {}
        }

        async function showInterstitialAd() {
            if (!window.Capacitor?.Plugins?.AdMob) return;
            const { AdMob } = window.Capacitor.Plugins;
            try {
                await AdMob.prepareInterstitial({ adId: ADMOB_TEST_INTERSTITIAL });
                await AdMob.showInterstitial();
            } catch (e) {}
        }

        async function watchRewardedAd(onSuccess = null) {
            playSound('click');
            triggerVibrate(50);
            if (!window.Capacitor?.Plugins?.AdMob) {
                showNotice("⚠️ AdMob hanya aktif di aplikasi Android (APK).");
                return;
            }
            const { AdMob } = window.Capacitor.Plugins;
            try {
                showNotice("⏳ Memuat Iklan...");
                const rewardListener = await AdMob.addListener('onRewardVideoReward', () => {
                    if (onSuccess) onSuccess();
                    else grantAdReward();
                    rewardListener.remove();
                });
                await AdMob.prepareRewardVideoAd({ adId: ADMOB_TEST_REWARDED });
                await AdMob.showRewardVideoAd();
            } catch (e) {
                showNotice("⚠️ Iklan belum siap. Coba lagi nanti!");
            }
        }

        function grantAdReward() {
            gameState.coins += 20;
            saveProgress();
            showNotice("🎉 +20 Koin Diperoleh!");
        }

        /* --- BANK LEVEL (1 - 50) --- */
        function getLevelData(levelNum) {
            const levels = {
                1: { title: "Buah manakah yang paling besar secara nyata?", hint: "Semangka adalah buah terbesar!", type: "choice", items: [{text:"🍇", correct:false}, {text:"🍓", correct:false}, {text:"🍎", correct:false}, {text:"🍉", correct:true}] },
                2: { title: "Nyalakan semua lilin di kegelapan!", hint: "Gunakan korek api 🔥 untuk menyalakan lilin!", type: "choice", items: [{text:"🕯️", correct:false}, {text:"🕯️", correct:false}, {text:"🔥", correct:true}] },
                3: { title: "Goyangkan HP Anda untuk merontokkan apel dari pohon!", hint: "Goyangkan HP Anda cukup kuat!", type: "sensor_shake", sensor: "shake", items: [{text:"🌳🍎", size:"90px"}] },
                4: { title: "Cari benda yang tidak bisa dimakan!", hint: "Piring digunakan untuk wadah, bukan dimakan!", type: "choice", items: [{text:"🍕", correct:false}, {text:"🍔", correct:false}, {text:"🍽️", correct:true}, {text:"🍟", correct:false}] },
                5: { title: "Miringkan HP Anda ke kanan untuk menggelindingkan bola!", hint: "Miringkan HP tajam ke arah kanan!", type: "sensor_tilt", sensor: "tilt", items: [{text:"⚽ ➡️ 🕳️", size:"70px"}] },
                6: { title: "Berapakah hasil dari: 1 + 2 x 3 = ?", hint: "Utamakan perkalian terlebih dahulu! 2x3 = 6 + 1", type: "choice", items: [{text:"9", correct:false}, {text:"7", correct:true}, {text:"8", correct:false}] },
                7: { title: "Mana yang paling tinggi di alam semesta?", hint: "Matahari berada paling tinggi di langit!", type: "choice", items: [{text:"🦒", correct:false}, {text:"🏢", correct:false}, {text:"☀️", correct:true}, {text:"🏔️", correct:false}] },
                8: { title: "Temukan warna hijau dengan mencampur warna!", hint: "Campurkan Biru dan Kuning!", type: "choice", items: [{text:"🔴 + 🔵", correct:false}, {text:"🟡 + 🔵", correct:true}, {text:"⚪ + 🔴", correct:false}] },
                9: { title: "Temukan bayi anak ayam yang baru menetas!", hint: "Ketuk telur yang sudah retak 🐣!", type: "choice", items: [{text:"🥚", correct:false}, {text:"🐣", correct:true}, {text:"🐔", correct:false}] },
                10: { title: "Goyangkan HP Anda untuk membangunkan kucing tidur!", hint: "Goyangkan HP Anda!", type: "sensor_shake", sensor: "shake", items: [{text:"💤🐱", size:"80px"}] },
                11: { title: "Mana hewan yang tidak bisa berenang?", hint: "Ayam tidak bisa berenang di air!", type: "choice", items: [{text:"🐟", correct:false}, {text:"🦆", correct:false}, {text:"🐔", correct:true}, {text:"🐸", correct:false}] },
                12: { title: "Miringkan HP Anda untuk memasukkan kunci ke lubang!", hint: "Miringkan HP Anda!", type: "sensor_tilt", sensor: "tilt", items: [{text:"🔑 ➡️ 🔒", size:"70px"}] },
                13: { title: "Berapa jam yang dibutuhkan untuk merebus 3 telur jika 1 telur butuh 5 menit?", hint: "Bisa direbus bersamaan dalam waktu 5 menit!", type: "choice", items: [{text:"15 Menit", correct:false}, {text:"5 Menit", correct:true}, {text:"10 Menit", correct:false}] },
                14: { title: "Mana angka yang paling besar di layar?", hint: "Pilih angka 99!", type: "choice", items: [{text:"12", correct:false}, {text:"50", correct:false}, {text:"99", correct:true}, {text:"8", correct:false}] },
                15: { title: "Goyangkan HP untuk mencampur bahan ramuan!", hint: "Goyangkan HP dengan kuat!", type: "sensor_shake", sensor: "shake", items: [{text:"🧪✨", size:"80px"}] },
                16: { title: "Mana yang paling cepat melesat?", hint: "Roket adalah yang tercepat!", type: "choice", items: [{text:"🚗", correct:false}, {text:"🚀", correct:true}, {text:"🚲", correct:false}, {text:"🏃", correct:false}] },
                17: { title: "Cari kendaraan yang tidak butuh bahan bakar fosil!", hint: "Sepeda dikayuh manusia!", type: "choice", items: [{text:"🚗", correct:false}, {text:"🚲", correct:true}, {text:"🚌", correct:false}] },
                18: { title: "Miringkan HP untuk menumpahkan air di botol!", hint: "Miringkan HP ke samping!", type: "sensor_tilt", sensor: "tilt", items: [{text:"🍾 ➡️ 🌊", size:"70px"}] },
                19: { title: "Siapakah anak dari induk sapi?", hint: "Anak sapi 🐮!", type: "choice", items: [{text:"🐥", correct:false}, {text:"🐮", correct:true}, {text:"🐷", correct:false}] },
                20: { title: "Matikan lampu kamar untuk tidur!", hint: "Ketuk bulan/malam 🌙!", type: "choice", items: [{text:"💡", correct:false}, {text:"🌙", correct:true}, {text:"☀️", correct:false}] }
            };
        if (levels[levelNum]) {
                return levels[levelNum];
            }

            const isShake = (levelNum % 4 === 0);
            const isTilt = (levelNum % 4 === 3);

            if (isShake) {
                return {
                    title: `Level ${levelNum}: Goyangkan HP Anda untuk menyelesaikan tantangan!`,
                    hint: "Goyangkan HP Anda dengan kuat!",
                    type: "sensor_shake",
                    sensor: "shake",
                    items: [{ text: "📦💥", size: "80px" }]
                };
            } else if (isTilt) {
                return {
                    title: `Level ${levelNum}: Miringkan HP Anda untuk mengarahkan objek!`,
                    hint: "Miringkan HP ke samping!",
                    type: "sensor_tilt",
                    sensor: "tilt",
                    items: [{ text: "🎯 ➡️️ 🌀", size: "70px" }]
                };
            } else {
                const targetIdx = (levelNum % 4);
                const options = ["⚡", "🔥", "💎", "⭐"];
                return {
                    title: `Level ${levelNum}: Cari simbol paling berharga (${options[targetIdx]})!`,
                    hint: `Ketuk ikon ${options[targetIdx]}`,
                    type: "choice",
                    sensor: null,
                    items: options.map((opt, idx) => ({ text: opt, correct: idx === targetIdx }))
                };
            }
        }

        /* --- GAME LOGIC --- */
        let currentLevelData = null;
        let selectedLockedLevel = null;

        function loadLevel(levelNum) {
            isLevelCompleting = false;

            if (levelNum > MAX_LEVELS) {
                showNotice("🎉 Tamat 50 Level!");
                gameState.currentLevel = 50;
                saveProgress();
                levelNum = 50;
            }

            disableSensors();
            currentLevelData = getLevelData(levelNum);

            document.getElementById('level-title-text').innerText = `LEVEL ${levelNum}`;
            document.getElementById('puzzle-instruction').innerText = currentLevelData.title;

            const progressPercent = (levelNum / MAX_LEVELS) * 100;
            document.getElementById('progress-fill').style.width = `${progressPercent}%`;

            const canvas = document.getElementById('puzzle-canvas');
            canvas.innerHTML = '';

            currentLevelData.items.forEach((item) => {
                const obj = document.createElement('div');
                obj.className = 'game-object';
                obj.innerText = item.text;
                if (item.size) obj.style.fontSize = item.size;

                obj.onclick = () => {
                    playSound('click');
                    triggerVibrate(40);
                    if (currentLevelData.type === 'choice') {
                        checkAnswer(item.correct);
                    }
                };

                canvas.appendChild(obj);
            });

            if (currentLevelData.sensor) {
                enableSensors(currentLevelData.sensor);
            }
        }

        function checkAnswer(isCorrect) {
            if (isLevelCompleting) return;

            if (isCorrect) {
                isLevelCompleting = true;
                disableSensors();

                playSound('correct');
                triggerVibrate(150);
                showNotice("🎉 Jawaban Benar!");

                setTimeout(() => {
                    if (gameState.currentLevel < MAX_LEVELS) {
                        gameState.currentLevel++;
                        if (gameState.currentLevel > gameState.maxUnlockedLevel) {
                            gameState.maxUnlockedLevel = gameState.currentLevel;
                        }
                        saveProgress();

                        if (gameState.currentLevel % 3 === 0) {
                            showInterstitialAd();
                        }

                        loadLevel(gameState.currentLevel);
                    } else {
                        showNotice("🏆 SELAMAT! TAMAT 50 LEVEL!");
                    }
                }, 1200);
            } else {
                playSound('wrong');
                triggerVibrate(250);
                showNotice("❌ Salah, Coba Lagi!");
            }
        }

        function useHint() {
            playSound('click');
            triggerVibrate(50);
            if (gameState.coins >= 20) {
                gameState.coins -= 20;
                saveProgress();
                alert("💡 Petunjuk:\n" + currentLevelData.hint);
            } else {
                showNotice("Koin tidak cukup!");
            }
        }

        function skipLevel() {
            playSound('click');
            triggerVibrate(50);
            if (gameState.coins >= 30) {
                gameState.coins -= 30;
                if (gameState.currentLevel < MAX_LEVELS) {
                    gameState.currentLevel++;
                    if (gameState.currentLevel > gameState.maxUnlockedLevel) {
                        gameState.maxUnlockedLevel = gameState.currentLevel;
                    }
                    saveProgress();
                    showNotice("⏭ Level Dilewati!");
                    setTimeout(() => loadLevel(gameState.currentLevel), 1000);
                }
            } else {
                showNotice("Koin tidak cukup!");
            }
        }

        function restartLevel() {
            playSound('click');
            triggerVibrate(50);
            loadLevel(gameState.currentLevel);
        }

        function openLevelModal() {
            playSound('click');
            triggerVibrate(50);
            const grid = document.getElementById('level-grid');
            grid.innerHTML = '';

            for (let i = 1; i <= MAX_LEVELS; i++) {
                const btn = document.createElement('button');
                btn.className = 'level-item';

                if (i === gameState.currentLevel) {
                    btn.classList.add('current');
                    btn.innerText = i;
                    btn.onclick = () => selectLevelFromModal(i);
                } else if (i <= gameState.maxUnlockedLevel) {
                    btn.classList.add('unlocked');
                    btn.innerText = i;
                    btn.onclick = () => selectLevelFromModal(i);
                } else {
                    btn.classList.add('locked');
                    btn.innerText = '🔒';
                    btn.onclick = () => promptUnlockLevel(i);
        }
        grid.appendChild(btn);
            }

            document.getElementById('level-modal').style.display = 'flex';
        }

        function closeLevelModal() {
            playSound('click');
            triggerVibrate(50);
            document.getElementById('level-modal').style.display = 'none';
        }

        function selectLevelFromModal(levelNum) {
            gameState.currentLevel = levelNum;
            saveProgress();
            closeLevelModal();
            startCurrentLevel();
        }

        function promptUnlockLevel(levelNum) {
            playSound('click');
            triggerVibrate(50);
            selectedLockedLevel = levelNum;
            document.getElementById('unlock-desc-text').innerText = `Level ${levelNum} masih terkunci!`;
            document.getElementById('unlock-modal').style.display = 'flex';
        }

        function closeUnlockModal() {
            playSound('click');
            triggerVibrate(50);
            document.getElementById('unlock-modal').style.display = 'none';
            selectedLockedLevel = null;
        }

        function unlockLevelWithCoins() {
            playSound('click');
            triggerVibrate(50);
            if (gameState.coins >= 30) {
                gameState.coins -= 30;
                gameState.maxUnlockedLevel = Math.max(gameState.maxUnlockedLevel, selectedLockedLevel);
                gameState.currentLevel = selectedLockedLevel;
                saveProgress();
                closeUnlockModal();
                closeLevelModal();
                showNotice(`🔓 Level ${selectedLockedLevel} Terbuka!`);
                startCurrentLevel();
            } else {
                showNotice("Koin tidak cukup (butuh 30 🪙)!");
            }
        }

        function unlockLevelWithAd() {
            watchRewardedAd(() => {
                gameState.maxUnlockedLevel = Math.max(gameState.maxUnlockedLevel, selectedLockedLevel);
                gameState.currentLevel = selectedLockedLevel;
                saveProgress();
                closeUnlockModal();
                closeLevelModal();
                showNotice(`🔓 Level ${selectedLockedLevel} Terbuka!`);
                startCurrentLevel();
            });
        }

        function openSettingsModal() {
            playSound('click');
            triggerVibrate(50);
            updateSettingsUI();
            document.getElementById('settings-modal').style.display = 'flex';
        }

        function closeSettingsModal() {
            playSound('click');
            triggerVibrate(50);
            document.getElementById('settings-modal').style.display = 'none';
        }

        function showNotice(msg) {
            const el = document.getElementById('overlay-msg');
            el.innerText = msg;
            el.style.display = 'block';
            setTimeout(() => {
                el.style.display = 'none';
            }, 1200);
        }

        /* --- INITIALIZATION --- */
        document.addEventListener('DOMContentLoaded', () => {
            updateCoinDisplay();
            updateSettingsUI();

            // Memulai AudioContext pada ketukan pertama layar
            document.body.addEventListener('click', () => {
                initAudio();
                if (gameState.soundEnabled && !bgmInterval) {
                    bgmInterval = setInterval(playBgmStep, 360);
                }
            }, { once: true });

            setTimeout(() => {
                initAdMob();
            }, 1000);
        });
    </script>

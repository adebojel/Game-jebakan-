<!DOCTYPE html>
<html lang="id" class="notranslate" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="google" content="notranslate">
    <title>Game Asah Otak</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 50%, #686de0 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 12px;
            overflow: hidden;
        }

        /* Card Utama Game */
        .game-card {
            background: #ffffff;
            width: 100%;
            max-width: 420px;
            height: 92vh;
            max-height: 760px;
            border-radius: 32px;
            padding: 16px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4), inset 0 2px 4px rgba(255, 255, 255, 0.8);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            border: 4px solid #4834d4;
        }

        /* Header Bar */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f0f3f8;
            padding: 8px 12px;
            border-radius: 20px;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.06);
        }

        .coin-container {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .coin-badge {
            background: linear-gradient(180deg, #f1c40f, #f39c12);
            padding: 6px 12px;
            border-radius: 50px;
            color: #ffffff;
            font-weight: 800;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 4px;
            text-shadow: 0 1px 2px rgba(0,0,0,0.3);
            box-shadow: 0 3px 0 #d35400, 0 4px 8px rgba(0,0,0,0.15);
        }

        .btn-ad-free {
            background: linear-gradient(180deg, #2ecc71, #27ae60);
            border: none;
            padding: 6px 10px;
            border-radius: 50px;
            color: #ffffff;
            font-weight: 800;
            font-size: 11px;
            cursor: pointer;
            box-shadow: 0 3px 0 #1e8449;
            transition: transform 0.1s;
        }

        .btn-ad-free:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #1e8449;
        }

        .level-info {
            text-align: center;
        }

        .level-title {
            font-size: 17px;
            font-weight: 900;
            color: #2c3e50;
            letter-spacing: 0.5px;
        }

        .level-tag {
            font-size: 9px;
            background: #eb4d4b;
            color: #ffffff;
            padding: 2px 8px;
            border-radius: 12px;
            font-weight: 800;
            display: inline-block;
            margin-top: 2px;
            text-transform: uppercase;
            box-shadow: 0 2px 4px rgba(235, 77, 75, 0.3);
        }

        .action-buttons {
            display: flex;
            gap: 6px;
        }

        .icon-btn {
            background: linear-gradient(180deg, #00d2d3, #01a3a4);
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 3px 0 #006266, 0 4px 8px rgba(0,0,0,0.2);
            transition: transform 0.1s;
        }

        .icon-btn:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #006266;
        }

        /* Arena Teka-Teki */
        .puzzle-card {
            background: linear-gradient(180deg, #f9fbfd 0%, #f1f5f9 100%);
            flex: 1;
            border-radius: 24px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            margin: 12px 0;
            border: 2px dashed #cbd5e1;
            overflow: hidden;
        }

        .puzzle-title {
            color: #1e293b;
            font-size: 16px;
            font-weight: 800;
            text-align: center;
            margin-bottom: 10px;
            min-height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1.3;
        }

        .puzzle-canvas {
            width: 100%;
            flex: 1;
            background: #ffffff;
            border-radius: 20px;
            position: relative;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-around;
            align-items: center;
            padding: 12px;
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.04);
            border: 1px solid #e2e8f0;
        }

        .game-object {
            font-size: 54px;
            cursor: pointer;
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 8px;
            border-radius: 16px;
            background: #ffffff;
            box-shadow: 0 6px 12px rgba(0,0,0,0.06);
            border: 2px solid #f1f5f9;
        }

        .game-object:active {
            transform: scale(1.2);
        }

        .sensor-badge {
            position: absolute;
            bottom: 8px;
            background: rgba(16, 172, 132, 0.15);
            color: #10ac84;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* Control Bottom Bar */
        .bottom-bar {
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }

        .btn-bottom {
            flex: 1;
            padding: 12px 8px;
            border: none;
            border-radius: 16px;
            font-weight: 800;
            font-size: 12px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 4px;
            color: #ffffff;
            text-shadow: 0 1px 2px rgba(0,0,0,0.2);
            transition: transform 0.1s;
        }

        .btn-hint {
            background: linear-gradient(180deg, #10ac84, #1dd1a1);
            box-shadow: 0 4px 0 #10ac84, 0 5px 10px rgba(0,0,0,0.15);
        }

        .btn-hint:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #10ac84;
        }

        .btn-skip {
            background: linear-gradient(180deg, #ff9f43, #ee5253);
            box-shadow: 0 4px 0 #b14343, 0 5px 10px rgba(0,0,0,0.15);
        }

        .btn-skip:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #b14343;
        }

        /* Notifikasi Overlay */
        .overlay-msg {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(15, 23, 42, 0.94);
            color: #ffffff;
            padding: 16px 24px;
            border-radius: 20px;
            font-weight: 800;
            font-size: 15px;
            display: none;
            z-index: 100;
            text-align: center;
            box-shadow: 0 20px 30px rgba(0,0,0,0.3);
            border: 2px solid rgba(255,255,255,0.2);
        }
    </style>
</head>
<body>

    <div class="game-card">
        <!-- Top Bar -->
        <div class="top-bar">
            <div class="coin-container">
                <div class="coin-badge">
                    <span>🟡</span> <span id="coin-count">60</span>
                </div>
                <button class="btn-ad-free" onclick="watchRewardedAd()">🎥 +20</button>
            </div>
            <div class="level-info">
                <div class="level-title" id="level-title-text">LEVEL 1</div>
                <div class="level-tag">ASAH OTAK</div>
            </div>
            <div class="action-buttons">
                <button class="icon-btn" onclick="restartLevel()">🔄</button>
                <button class="icon-btn" onclick="testVibration()">📳</button>
            </div>
        </div>

        <!-- Puzzle Arena -->
        <div class="puzzle-card">
            <div class="puzzle-title" id="puzzle-instruction">Memuat teka-teki...</div>
            <div class="puzzle-canvas" id="puzzle-canvas"></div>
            <div class="sensor-badge" id="sensor-badge" style="display: none;">
                📡 Sensor Gerak Aktif
            </div>
            <div class="overlay-msg" id="overlay-msg"></div>
        </div>

        <!-- Bottom Bar -->
        <div class="bottom-bar">
            <button class="btn-bottom btn-hint" onclick="useHint()">💡 Petunjuk (20 🪙)</button>
            <button class="btn-bottom btn-skip" onclick="skipLevel()">⏭ Lewati (30 🪙)</button>
        </div>
    </div>

    <script>
        // --- 1. DETEKTOR ERROR ---
        window.onerror = function(msg, url, lineNo) {
            console.error("🔴 Info Kendala: " + msg + " (Baris: " + lineNo + ")");
            return false;
        };

        // --- 2. GAME STATE ---
        let gameState = {
            currentLevel: parseInt(localStorage.getItem('game_level')) || 1,
            coins: parseInt(localStorage.getItem('game_coins')) || 60
        };

        function saveProgress() {
            localStorage.setItem('game_level', gameState.currentLevel);
            localStorage.setItem('game_coins', gameState.coins);
        }

        // --- 3. AUDIO SYNTHESIZER & VIBRATION ---
        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) {
                const AudioCtxClass = window.AudioContext || window.webkitAudioContext;
                if (AudioCtxClass) audioCtx = new AudioCtxClass();
            }
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playSound(type) {
            try {
                initAudio();
                if (!audioCtx) return;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                if (type === 'correct') {
                    osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
                    osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1);
                    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.3);
                } else if (type === 'wrong') {
                    osc.frequency.setValueAtTime(180, audioCtx.currentTime);
                    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.2);
                } else if (type === 'click') {
                    osc.frequency.setValueAtTime(450, audioCtx.currentTime);
                    gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.05);
                }
            } catch (e) {}
        }

        function triggerVibrate(pattern = 60) {
            if ("vibrate" in navigator) {
                navigator.vibrate(pattern);
            }
        }

        function testVibration() {
            triggerVibrate([100, 50, 100]);
            playSound('click');
        }

        // --- 4. HARDWARE SENSOR ENGINE ---
        let activeSensorType = null;
        let lastShakeTime = 0;

        function enableSensors(sensorType) {
            disableSensors();
            activeSensorType = sensorType;
            document.getElementById('sensor-badge').style.display = 'flex';

            if (sensorType === 'shake') {
                window.addEventListener('devicemotion', handleMotion, false);
            } else if (sensorType === 'tilt') {
                window.addEventListener('deviceorientation', handleOrientation, false);
            }
        }

        function disableSensors() {
            window.removeEventListener('devicemotion', handleMotion, false);
            window.removeEventListener('deviceorientation', handleOrientation, false);
            activeSensorType = null;
            document.getElementById('sensor-badge').style.display = 'none';
        }

        function handleMotion(e) {
            const acc = e.accelerationIncludingGravity;
            if (!acc) return;
            const totalForce = Math.abs(acc.x) + Math.abs(acc.y) + Math.abs(acc.z);
            
            if (totalForce > 24) {
                const now = Date.now();
                if (now - lastShakeTime > 800) {
                    lastShakeTime = now;
                    onSensorTriggered('shake');
                }
            }
        }

        function handleOrientation(e) {
            const gamma = e.gamma;
            if (Math.abs(gamma) > 35) {
                onSensorTriggered('tilt');
            }
        }

        function onSensorTriggered(action) {
            if (activeSensorType === action) {
                triggerVibrate(150);
                checkAnswer(true);
            }
        }

        // --- 5. GOOGLE ADMOB MONETIZATION INTEGRATION ---
        const ADMOB_TEST_BANNER = 'ca-app-pub-9305273212801233/9094905669';
        const ADMOB_TEST_INTERSTITIAL = 'ca-app-pub-9305273212801233/1355093008';
        const ADMOB_TEST_REWARDED = 'ca-app-pub-9305273212801233/8495216428';

        async function initAdMob() {
            if (!window.Capacitor || !window.Capacitor.Plugins || !window.Capacitor.Plugins.AdMob) {
                console.log("AdMob: Berjalan di Browser/Preview Mode.");
                return;
            }

            const { AdMob } = window.Capacitor.Plugins;

            try {
                await AdMob.initialize({
                    requestTrackingAuthorization: true,
                    initializeForTesting: false
                });

                showBannerAd();
            } catch (err) {
                console.log("AdMob Init Exception:", err);
            }
        }

        async function showBannerAd() {
            if (!window.Capacitor?.Plugins?.AdMob) return;
            const { AdMob } = window.Capacitor.Plugins;

            try {
                await AdMob.showBanner({
                    adId: ADMOB_TEST_BANNER,
                    adSize: 'BANNER',
                    position: 'BOTTOM_CENTER',
                    margin: 0
                });
            } catch (e) {
                console.log("Gagal menampilkan Banner Ad:", e);
            }
        }

        async function showInterstitialAd() {
            if (!window.Capacitor?.Plugins?.AdMob) return;
            const { AdMob } = window.Capacitor.Plugins;

            try {
                await AdMob.prepareInterstitial({ adId: ADMOB_TEST_INTERSTITIAL });
                await AdMob.showInterstitial();
            } catch (e) {
                console.log("Gagal menampilkan Interstitial Ad:", e);
            }
        }

        async function watchRewardedAd() {
            playSound('click');
            
            if (!window.Capacitor?.Plugins?.AdMob) {
                if (confirm("[MODE TEST BROWSER] Tonton iklan simulasi untuk +20 Koin Gratis?")) {
                    gameState.coins += 20;
                    saveProgress();
                    document.getElementById('coin-count').innerText = gameState.coins;
                    showNotice("🎉 +20 Koin Gratis Diperoleh!");
                }
                return;
            }

            const { AdMob } = window.Capacitor.Plugins;

            try {
                const rewardListener = await AdMob.addListener('onRewardVideoReward', (reward) => {
                    gameState.coins += 20;
                    saveProgress();
                    document.getElementById('coin-count').innerText = gameState.coins;
                    showNotice("🎉 +20 Koin Gratis Diperoleh!");
                    rewardListener.remove();
                });

                await AdMob.prepareRewardVideoAd({ adId: ADMOB_TEST_REWARDED });
                await AdMob.showRewardVideoAd();
            } catch (e) {
                alert("Iklan video belum tersedia. Pastikan koneksi internet Anda aktif!");
            }
        }

        // --- 6. DATA 500 LEVEL GENERATOR SYSTEM ---
        function getLevelData(levelNum) {
            if (levelNum === 1) {
                return {
                    title: "Buah manakah yang paling besar secara nyata?",
                    hint: "Pikirkan ukuran asli di dunia nyata!",
                    type: "choice",
                    sensor: null,
                    items: [
                        { text: "🍇", size: "60px", correct: false },
                        { text: "🍓", size: "70px", correct: false },
                        { text: "🍎", size: "50px", correct: false },
                        { text: "🍉", size: "45px", correct: true }
                    ]
                };
            } else if (levelNum === 2) {
                return {
                    title: "Goyang HP Anda untuk menjatuhkan Apel dari pohon!",
                    hint: "Goyangkan perangkat HP Anda!",
                    type: "sensor_shake",
                    sensor: "shake",
                    items: [
                        { id: "apple-tree", text: "🌳🍎🍎", size: "90px" }
                    ]
                };
            } else if (levelNum === 3) {
                return {
                    title: "Miringkan HP Anda ke samping untuk menggelindingkan bola!",
                    hint: "Miringkan posisi HP Anda ke arah kanan!",
                    type: "sensor_tilt",
                    sensor: "tilt",
                    items: [
                        { id: "rolling-ball", text: "⚽ ➡️ 🕳️", size: "70px" }
                    ]
                };
            } else {
                const isSensorLevel = (levelNum % 4 === 0);
                if (isSensorLevel) {
                    return {
                        title: `Level ${levelNum}: Goyangkan HP Anda untuk membuka kotak misteri!`,
                        hint: "Goyangkan perangkat HP Anda agak kuat!",
                        type: "sensor_shake",
                        sensor: "shake",
                        items: [{ text: "🎁", size: "80px" }]
                    };
                } else {
                    const target = (levelNum % 3) + 1;
                    return {
                        title: `Level ${levelNum}: Ketuk angka ke-${target}!`,
                        hint: `Pilih angka nomor ${target}`,
                        type: "choice",
                        sensor: null,
                        items: [
                            { text: "1️⃣", size: "52px", correct: target === 1 },
                            { text: "2️⃣", size: "52px", correct: target === 2 },
                            { text: "3️⃣", size: "52px", correct: target === 3 }
                        ]
                    };
                }
            }
        }

     // --- 7. CORE GAME ENGINE & RENDERING ---
        let currentLevelData = null;

        function loadLevel(levelNum) {
            disableSensors();
            currentLevelData = getLevelData(levelNum);

            document.getElementById('level-title-text').innerText = `LEVEL ${levelNum}`;
            document.getElementById('coin-count').innerText = gameState.coins;
            document.getElementById('puzzle-instruction').innerText = currentLevelData.title;

            const canvas = document.getElementById('puzzle-canvas');
            canvas.innerHTML = '';

            currentLevelData.items.forEach((item) => {
                const obj = document.createElement('div');
                obj.className = 'game-object';
                obj.innerText = item.text;
                obj.style.fontSize = item.size || '50px';

                obj.onclick = () => {
                    playSound('click');
                    if (currentLevelData.type === 'choice') {
                        checkAnswer(item.correct);
                    }
                };

                canvas.appendChild(obj);
            });

            if (currentLevelData.sensor) {
                enableSensors(currentLevelData.sensor);
            }
        }

        function checkAnswer(isCorrect) {
            if (isCorrect) {
                playSound('correct');
                triggerVibrate([80, 50, 80]);
                showNotice("🎉 Jawaban Benar!");

                setTimeout(() => {
                    gameState.currentLevel++;
                    saveProgress();

                    if (gameState.currentLevel % 3 === 0) {
                        showInterstitialAd();
                    }

                    loadLevel(gameState.currentLevel);
                }, 1200);
            } else {
                playSound('wrong');
                triggerVibrate(200);
                showNotice("❌ Salah, Coba Lagi!");
            }
        }

        function useHint() {
            playSound('click');
            if (gameState.coins >= 20) {
                gameState.coins -= 20;
                saveProgress();
                document.getElementById('coin-count').innerText = gameState.coins;
                alert("💡 Petunjuk:\n" + currentLevelData.hint);
            } else {
                alert("Koin tidak cukup! Tonton video untuk dapat +20 Koin.");
            }
        }

        function skipLevel() {
            playSound('click');
            if (gameState.coins >= 30) {
                gameState.coins -= 30;
                gameState.currentLevel++;
                saveProgress();
                showNotice("⏭ Level Dilewati!");
                setTimeout(() => {
                    loadLevel(gameState.currentLevel);
                }, 1000);
            } else {
                alert("Koin tidak cukup! Tonton video untuk dapat +20 Koin.");
            }
        }

        function restartLevel() {
            playSound('click');
            loadLevel(gameState.currentLevel);
        }

        function showNotice(msg) {
            const el = document.getElementById('overlay-msg');
            el.innerText = msg;
            el.style.display = 'block';
            setTimeout(() => {
                el.style.display = 'none';
            }, 1200);
        }

        // --- 8. INITIALIZATION ON LOAD ---
        document.addEventListener('DOMContentLoaded', () => {
            try {
                loadLevel(gameState.currentLevel);
            } catch (e) {
                console.error("Gagal memuat level:", e);
            }

            setTimeout(() => {
                initAdMob();
            }, 1000);
        });
    </script>
</body>
</html>
